<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Cube with Three.js</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #startAR { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
                   padding: 10px 20px; font-size: 18px; background: green; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <button id="startAR">Start AR</button>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        let scene, camera, renderer, cube;
        let xrSession = null;
        let xrRefSpace = null;

        function initScene() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.5, 3); // Position camera slightly above ground

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.xr.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Cube
            const geometry = new THREE.BoxGeometry(0.2, 0.2, 0.2); // Smaller cube for AR
            const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
            cube = new THREE.Mesh(geometry, material);
            cube.position.set(0, 1, -1); // Move cube in front of the camera
            scene.add(cube);

            // Lighting
            const light = new THREE.AmbientLight(0xffffff);
            scene.add(light);

            animate();
        }

        async function startAR() {
            if (!navigator.xr) {
                alert("WebXR not supported on this device.");
                return;
            }

            try {
                xrSession = await navigator.xr.requestSession("immersive-ar", { requiredFeatures: ["local-floor"] });
                renderer.xr.setSession(xrSession);

                xrRefSpace = await xrSession.requestReferenceSpace("local-floor");

                document.getElementById("startAR").style.display = "none";

                xrSession.requestAnimationFrame(onXRFrame);
            } catch (error) {
                console.error("Failed to start AR session:", error);
            }
        }

        function onXRFrame(time, frame) {
            let session = frame.session;
            let pose = frame.getViewerPose(xrRefSpace);

            if (pose) {
                cube.rotation.y += 0.01;
                renderer.render(scene, camera);
            }

            session.requestAnimationFrame(onXRFrame);
        }

        function animate() {
            cube.rotation.y += 0.01;
            renderer.render(scene, camera);
            requestAnimationFrame(animate);
        }

        document.getElementById("startAR").addEventListener("click", startAR);

        window.addEventListener("resize", () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        initScene();
    </script>
</body>
</html>
